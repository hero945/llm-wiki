<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="810" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="640" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">统计分析平台（SCE）目标架构 v1.0</text>
  <text x="640" y="62" text-anchor="middle" font-size="13" fill="#64748b">受控 · 可追溯 · 可复用 —— 最小闭环优先：任务能跑、日志能查、差异能比、全程留痕</text>

  <!-- ============ 左侧主区域 ============ -->

  <!-- 用户层 -->
  <rect x="24" y="90" width="948" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="110" font-size="12" font-weight="700" fill="#64748b">用户层</text>
  <rect x="80" y="112" width="280" height="40" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="220" y="136" text-anchor="middle" font-size="13" fill="#0f172a">统计程序员（开发 / 提交任务）</text>
  <rect x="380" y="112" width="280" height="40" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="520" y="136" text-anchor="middle" font-size="13" fill="#0f172a">生物统计师（复核 / 签字）</text>
  <rect x="680" y="112" width="260" height="40" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="810" y="136" text-anchor="middle" font-size="13" fill="#0f172a">平台管理员（环境 / 权限）</text>

  <line x1="500" y1="160" x2="500" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 统一入口 -->
  <rect x="24" y="180" width="948" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="200" font-size="12" font-weight="700" fill="#64748b">统一入口</text>
  <rect x="80" y="196" width="860" height="34" rx="6" fill="#0f766e"/>
  <text x="510" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">SCE Web 门户 —— 单点登录（AD/SSO） · 账号唯一 · 会话留痕</text>

  <line x1="500" y1="240" x2="500" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 平台服务层 -->
  <rect x="24" y="260" width="948" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="280" font-size="12" font-weight="700" fill="#64748b">平台服务层（自建核心）</text>
  <rect x="48" y="292" width="210" height="76" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="153" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">任务中心</text>
  <text x="153" y="336" text-anchor="middle" font-size="11" fill="#475569">提交 / 监控 / 批处理</text>
  <text x="153" y="354" text-anchor="middle" font-size="11" fill="#475569">断点重试 · 进度追踪</text>
  <rect x="282" y="292" width="210" height="76" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="387" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">资产中心</text>
  <text x="387" y="336" text-anchor="middle" font-size="11" fill="#475569">程序 / 宏 / 模板库（Git）</text>
  <text x="387" y="354" text-anchor="middle" font-size="11" fill="#475569">草稿→审核→发布状态机</text>
  <rect x="516" y="292" width="210" height="76" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="621" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">质量中心</text>
  <text x="621" y="336" text-anchor="middle" font-size="11" fill="#475569">输出差异比较 · 日志扫描</text>
  <text x="621" y="354" text-anchor="middle" font-size="11" fill="#475569">集成 Pinnacle 21 校验</text>
  <rect x="750" y="292" width="210" height="76" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="855" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">复核与留痕</text>
  <text x="855" y="336" text-anchor="middle" font-size="11" fill="#475569">复核工作流（一期从简）</text>
  <text x="855" y="354" text-anchor="middle" font-size="11" fill="#475569">电子签字 · UAT 记录</text>

  <line x1="500" y1="380" x2="500" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 执行层 -->
  <rect x="24" y="400" width="948" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="420" font-size="12" font-weight="700" fill="#64748b">执行层</text>
  <rect x="48" y="432" width="200" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="148" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">任务队列 / 调度</text>
  <text x="148" y="474" text-anchor="middle" font-size="11" fill="#475569">自研轻量编排</text>
  <line x1="248" y1="460" x2="286" y2="460" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="432" width="320" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">SAS 9.4 Server 受控计算节点</text>
  <text x="450" y="474" text-anchor="middle" font-size="11" fill="#475569">存量主力 · 许可按核计费（成本一等公民）</text>
  <rect x="640" y="432" width="320" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="800" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">R / Python 容器（K8s）</text>
  <text x="800" y="474" text-anchor="middle" font-size="11" fill="#475569">镜像固化 = 环境可重现 · 白名单包管理</text>

  <line x1="500" y1="500" x2="500" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 数据层 -->
  <rect x="24" y="520" width="948" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="540" font-size="12" font-weight="700" fill="#64748b">数据层</text>
  <rect x="48" y="552" width="230" height="66" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="163" y="576" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">临床研发数仓（01号项目）</text>
  <text x="163" y="596" text-anchor="middle" font-size="11" fill="#92400e">唯一数据入口 · 只读快照</text>
  <line x1="278" y1="585" x2="316" y2="585" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="552" width="640" height="66" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="336" y="572" font-size="12" font-weight="700" fill="#15803d">受控数据区（目录：study / domain / version）</text>
  <rect x="340" y="582" width="190" height="28" rx="4" fill="#ffffff" stroke="#16a34a"/>
  <text x="435" y="600" text-anchor="middle" font-size="12" fill="#166534">源数据层（raw）</text>
  <rect x="560" y="582" width="190" height="28" rx="4" fill="#ffffff" stroke="#16a34a"/>
  <text x="655" y="600" text-anchor="middle" font-size="12" fill="#166534">SDTM 标准层</text>
  <rect x="780" y="582" width="160" height="28" rx="4" fill="#ffffff" stroke="#16a34a"/>
  <text x="860" y="600" text-anchor="middle" font-size="12" fill="#166534">ADaM 分析层</text>

  <line x1="500" y1="630" x2="500" y2="648" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 环境分层 -->
  <rect x="24" y="650" width="948" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="670" font-size="12" font-weight="700" fill="#64748b">环境分层</text>
  <rect x="120" y="666" width="230" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="235" y="687" text-anchor="middle" font-size="12" fill="#334155">DEV 开发（自由调试）</text>
  <line x1="350" y1="682" x2="408" y2="682" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="412" y="666" width="230" height="32" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="527" y="687" text-anchor="middle" font-size="12" fill="#92400e">VAL 验证（双人 QC / UAT）</text>
  <line x1="642" y1="682" x2="700" y2="682" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="704" y="666" width="250" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="829" y="687" text-anchor="middle" font-size="12" fill="#166534">PROD 生产（锁定数据 · 全程留痕）</text>

  <!-- 基础设施 -->
  <rect x="24" y="726" width="948" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="498" y="755" text-anchor="middle" font-size="12" fill="#334155">基础设施：受控存储（结果不可变） · 计算 / 网络 · 备份恢复 · NTP 可信时间 · 日志与监控</text>

  <!-- ============ 右侧治理与合规 ============ -->
  <rect x="996" y="90" width="260" height="684" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1126" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">治理与合规（贯穿各层）</text>

  <rect x="1012" y="140" width="228" height="118" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="1126" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">元数据模型</text>
  <text x="1126" y="186" text-anchor="middle" font-size="11" fill="#475569">study / program / run /</text>
  <text x="1126" y="204" text-anchor="middle" font-size="11" fill="#475569">output / version 绑定</text>
  <text x="1126" y="228" text-anchor="middle" font-size="11" fill="#991b1b">可追溯性的技术基础</text>

  <rect x="1012" y="282" width="228" height="118" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="1126" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">审计库</text>
  <text x="1126" y="328" text-anchor="middle" font-size="11" fill="#475569">append-only · 独立存储</text>
  <text x="1126" y="346" text-anchor="middle" font-size="11" fill="#475569">who / when / what / which</text>
  <text x="1126" y="370" text-anchor="middle" font-size="11" fill="#991b1b">21 CFR Part 11 核心</text>

  <rect x="1012" y="424" width="228" height="118" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="1126" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">权限模型</text>
  <text x="1126" y="470" text-anchor="middle" font-size="11" fill="#475569">角色 × Study × 环境</text>
  <text x="1126" y="488" text-anchor="middle" font-size="11" fill="#475569">最小权限 · 数据范围隔离</text>
  <text x="1126" y="512" text-anchor="middle" font-size="11" fill="#991b1b">跨 Study 访问需审批</text>

  <rect x="1012" y="566" width="228" height="118" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="1126" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">验证（CSV）</text>
  <text x="1126" y="612" text-anchor="middle" font-size="11" fill="#475569">IQ / OQ / PQ 文档留档</text>
  <text x="1126" y="630" text-anchor="middle" font-size="11" fill="#475569">升级触发再验证评估</text>
  <text x="1126" y="654" text-anchor="middle" font-size="11" fill="#991b1b">与 QA 提前对齐责任</text>

  <text x="1126" y="726" text-anchor="middle" font-size="11" fill="#7f1d1d">原则：一期做薄 ——</text>
  <text x="1126" y="746" text-anchor="middle" font-size="11" fill="#7f1d1d">先能跑、能查、能追溯，</text>
  <text x="1126" y="766" text-anchor="middle" font-size="11" fill="#7f1d1d">避免过度监管（PHUSE 教训）</text>
</svg>
